[project]
name = "ai-interview-platform"                 # distribution name for this monorepo's python packages
version = "0.1.0"                              # starting semantic version, bump per release later
description = "AI Interview Intelligence Platform: FastAPI backend, ARQ workers, and ml/ package"  # short summary shown by packaging tools
readme = "README.md"                           # long description pulled from README when building a package
requires-python = ">=3.11,<3.12"                # pin to the 3.11.x line to match pyenv 3.11.9 exactly
dependencies = [
    "fastapi>=0.115,<0.116",                    # the web framework serving all HTTP routers
    "uvicorn[standard]>=0.32,<0.33",            # ASGI server used to run the FastAPI app, with uvloop/httptools extras
    "sqlalchemy[asyncio]>=2.0,<2.1",            # ORM + core, async engine used against Postgres
    "asyncpg>=0.29,<0.30",                      # async postgres driver used by SQLAlchemy's asyncpg dialect
    "alembic>=1.13,<1.14",                      # schema migration tool, tracks db state as versioned python scripts
    "pydantic>=2.9,<3",                         # data validation/settings models used throughout schemas and config
    "pydantic-settings>=2.5,<3",                # loads typed settings objects from environment variables / .env
    "python-dotenv>=1.0,<2",                    # loads .env into process environment for local development
    "email-validator>=2.2,<3",                  # backs pydantic's EmailStr used on the User model and auth schemas
    "pyjwt>=2.9,<3",                             # encodes/decodes signed access + refresh JWTs (replaces python-jose per plan)
    "argon2-cffi>=23.1,<24",                    # Argon2id password hashing, the OWASP-recommended KDF for credentials
    "slowapi>=0.1.9,<0.2",                      # per-route/per-IP rate limiting middleware for auth endpoints
    "python-multipart>=0.0.12,<0.1",            # required by FastAPI/Starlette to parse form-encoded request bodies
    "arq>=0.26,<0.27",                          # Redis job queue; FastAPI enqueues, a separate worker process runs jobs
    "pymupdf>=1.24,<1.25",                      # primary PDF text extractor (AGPL); approved in Part 0 of the plan
    "pypdfium2>=4.30,<5",                       # MIT fallback PDF extractor if pymupdf fails or AGPL is unacceptable
    "spacy>=3.7,<3.8",                          # sentence/section splitting + PhraseMatcher for ESCO skill matching
    "numpy>=1.24,<2",                           # pinned below 2.0: spacy 3.7's thinc wheels are compiled against numpy 1.x ABI
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    # ^ small English spaCy pipeline pinned as a direct wheel URL (spaCy models are not on PyPI proper)
    # so `uv sync` installs it deterministically in local dev *and* CI without a separate `spacy download` step.
    "sentence-transformers>=3.0,<4",             # loads all-MiniLM-L6-v2 to embed resume/posting text into 384-d vectors
    "scikit-learn>=1.5,<2",                     # TfidfVectorizer + cosine_similarity, the baseline matching arm
    "pgvector>=0.3,<0.4",                       # SQLAlchemy Vector column type + numpy adapter for Postgres pgvector
    "httpx>=0.27,<0.28",                        # HTTP client for ml.llm Ollama + OpenAI-compatible backends (also pytest)
]

[dependency-groups]
dev = [
    "ruff>=0.7,<0.8",                           # fast linter + formatter, run in CI to enforce style/quality
    "pytest>=8.3,<9",                           # test runner for backend unit/integration tests
    "pytest-asyncio>=0.24,<0.25",               # allows pytest to run `async def` test functions
    "httpx>=0.27,<0.28",                        # async HTTP client used by FastAPI's TestClient-style integration tests
]

[tool.ruff]
line-length = 120                               # generous limit to allow explanatory inline comments per project convention
target-version = "py311"                        # tells ruff which python version's syntax to assume when linting
src = ["backend", "ml"]                         # source roots ruff treats as first-party for import sorting

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]             # pycodestyle errors, pyflakes, isort, pyupgrade, and bugbear rule sets
ignore = [
    "B008",                                      # FastAPI's `Depends(...)` in a default arg is the documented idiom, not a bug
]

[tool.pytest.ini_options]
asyncio_mode = "auto"                           # lets pytest-asyncio run async tests without per-test decorators
# Explicit (rather than the deprecated "unset") default: each async test/fixture gets its own fresh
# event loop, matching pytest-asyncio's own eventual default. Our async engine's connection pool is
# disposed after every test (see backend/tests/conftest.py's `_dispose_engine_between_tests` fixture)
# specifically so that pooled asyncpg connections never get reused across two different event loops.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]                   # directory pytest searches for test modules
pythonpath = [".", "backend"]                   # ensures `import app...` and `import ml...` resolve from repo root

[build-system]
requires = ["hatchling"]                        # build backend needed to make this a valid installable package
build-backend = "hatchling.build"               # entry point hatchling uses to build sdists/wheels

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "ml"]                # the two importable packages this project ships: `app` and `ml`

[tool.hatch.metadata]
allow-direct-references = true                  # required because en-core-web-sm above is pinned as a direct wheel URL, not a PyPI version
